<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 248" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B3A55" />
      <stop offset="100%" stop-color="#182333" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FD1FF" />
      <stop offset="100%" stop-color="#2E86FF" />
    </linearGradient>
  </defs>

  <!-- Store icon requirement: true circle background, no transparency/black
       fill, 4px transparent safe margin already accounted for by sizing
       the circle at r=120 inside a 248x248 canvas (docs.zepp.com/docs/
       designs/visual/icons/, 18.08.2026 rejection point 3). Deliberately
       NOT Nuki's yellow/orange - neutral blue instead (rejection point 1
       - avoid imitating a protected brand's look, not just its name). -->
  <circle cx="124" cy="124" r="120" fill="url(#bgGrad)" />

  <!-- Connectivity ring -->
  <circle cx="124" cy="124" r="78" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="300 190" transform="rotate(-45 124 124)" />

  <!-- Padlock -->
  <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 104 112 V 92 C 104 78.7 114.7 68 128 68 C 141.3 68 152 78.7 152 92 V 112" />
    <rect x="90" y="112" width="76" height="60" rx="14" fill="#20304A" stroke="#FFFFFF" stroke-width="10" />
    <circle cx="128" cy="138" r="6" fill="#4FD1FF" stroke="none" />
    <path d="M 128 144 V 156" stroke="#4FD1FF" stroke-width="5" />
  </g>
</svg>
